# Builds the SatView APK on GitHub's computers every time code is pushed,
# then publishes it on the repository's "Releases" page for easy phone download.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SatView.apk

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatView-apk
          path: SatView.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SatView.apk \
            --title "SatView (latest build)" \
            --notes "Download SatView.apk on your Android phone and open it to install. Built from commit ${GITHUB_SHA::7}."
